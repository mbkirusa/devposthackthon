apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: energy-ops-agent
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containers:
        - image: us-docker.pkg.dev/PROJECT_ID/energy-ops-agent/app:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: STARTUP_OPS_MODEL
              value: gemini-2.5-flash
            - name: STARTUP_OPS_ACTOR_ID
              value: founder-001
            - name: STARTUP_OPS_ACTOR_ROLE
              value: founder
          startupProbe:
            httpGet:
              path: /v1/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
